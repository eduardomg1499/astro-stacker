[package]
name = "astro-stacker"
version = "0.2.8"
description = "ZenithAstroCode"
authors = ["ZenithAstroCode-by-EduardoMG"]
edition = "2021"
default-run = "astro-stacker"

[lib]
name = "astro_stacker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Compila el simulador de verdad conocida (deepsky_sim) fuera de los tests,
# p.ej. para generar datasets sintéticos de benchmark desde un binario.
deepsky-sim = []
# Ídem para el simulador planetario (planetary_sim, arnés A/B F0).
planetary-sim = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: sirve archivos locales al WebView via convertFileSrc().
# Sin esta feature, los previews nativos del mosaico (file_path:) y el
# reproductor de animacion desde rutas estaban ROTOS, y los resultados de
# apilado tenian que viajar como base64 por IPC (pico de RAM del WebView).
tauri = { version = "2.0.0", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.9.0"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
# FFT CPU para NF-Full (coadición GLS por frecuencia, tiles con overlap-add).
rustfft = "6"
libc = "0.2"
memmap2 = "0.9"
byteorder = "1.5"
image = "0.23.14"
tiff = "0.6.1"
base64 = "0.22"
bincode = "1.3.3"
sysinfo = "0.30"
lru = "0.12"
dunce = "1.0"
imageproc = "0.22.0"
rusttype = "0.9.3"
reqwest = { version = "0.11", features = ["json", "blocking"] }
machine-uid = "0.5"
aes-gcm = "0.10"
hex = "0.4"
chrono = "0.4"
sha2 = "0.10"
rand = "0.8"
akaze = { git = "https://github.com/rust-cv/akaze" }
num_cpus = "1.16.0"
crossbeam-channel = "0.5"
fitrs = "0.5.0"
lz4_flex = "0.11.1"
# GPU COMPUTE (etapa de acumulacion del apilado): wgpu = Metal en macOS,
# DX12/Vulkan/GL en Windows. La ruta CPU queda intacta como referencia y
# fallback total; ver src/gpu_stack.rs.
wgpu = "23"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[patch.crates-io]
bitarray = { path = "./vendor/bitarray" }

# --- SEGURIDAD: CONFIGURACION DE PRODUCCION ---
[profile.release]
codegen-units = 1     # Mejor optimizacion, mas lento de compilar
lto = true            # Link Time Optimization: Mezcla todo el codigo (dificil de separar)
strip = true          # Elimina simbolos de depuracion (nombres de funciones, rutas)
panic = "unwind"      # Permite capturar panics y mostrar error en vez de cerrar la app en seco
opt-level = 3         # Maxima velocidad (o "z" para ofuscacion por tamaño minimo)

# --- DEV UTILIZABLE: sin esto, `tauri dev` compila a opt-level 0 (código 10-40x
# más lento: análisis/apilado tardan una eternidad y parecen "colgados" aunque
# AVX2/NEON se detecten). Con opt-level 2 el dev rinde cerca del release para
# probar flujos; el benchmark real sigue siendo el build release.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3         # dependencias (ffmpeg-io, lz4, rayon, image...) siempre a fondo
