name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # Las pruebas físicas GPU permanecen #[ignore] en CI hospedado. Este
      # paso conserva la referencia CPU y toda la matriz sintética/fallos en
      # macOS y Windows; los asistentes de release ejecutan además el gate GPU.
      - name: Test CPU and synthetic pipelines
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast
